[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudlens"
version = "0.1.0"
description = "Real-time fraud detection and risk intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abhinav Kumar" }]
keywords = ["fraud-detection", "machine-learning", "risk-scoring", "explainable-ai"]

dependencies = [
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # modelling
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "shap>=0.46",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "websockets>=12.0",
    # ops
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8",
]
data = ["kagglehub>=0.3"]
notebooks = ["jupyterlab>=4.2", "matplotlib>=3.9", "seaborn>=0.13"]
kafka = ["aiokafka>=0.11"]
redis = ["redis>=5.0"]
spark = ["pyspark>=3.5"]

[project.scripts]
fraudlens = "fraudlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlens"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "ANN",       # type annotations
    "S",         # bandit security
    "PD",        # pandas-vet
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "S311",    # stdlib random is fine for simulation, not used for crypto
    "N812",    # `from ... import constants as C` is a deliberate convention:
               # domain constants are referenced constantly (C.TIMESTAMP_COL,
               # C.TARGET_COL) and a one-letter alias keeps those call sites
               # readable. Applied consistently across the codebase.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PD901"]
"notebooks/**" = ["ALL"]
"scripts/**" = ["S101", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["fraudlens"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src/fraudlens"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "xgboost.*",
    "shap.*",
    "sklearn.*",
    "duckdb.*",
    "kagglehub.*",
    "joblib.*",
    # pandas-stubs does not yet track pandas 3.x, and redis is an
    # optional extra only installed under the docker profile.
    "pandas.*",
    "redis.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: tests that take more than a few seconds",
    "integration: requires multiple components wired together",
    "e2e: requires a running service",
]

[tool.coverage.run]
source = ["src/fraudlens"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
